name: Aggiornamento dati funghi
on:
  schedule:
    - cron: "15 3 * * *"   # 03:15 UTC = 05:15 ora legale / 04:15 ora solare
  workflow_dispatch:
  push:
    branches: [main]
concurrency: update-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Dati
        run: |
          if [ ! -f data/static.npz ]; then
            echo "::warning::Manca data/static.npz: lancia «Preparazione dati statici»"
          elif [ "${{ github.event_name }}" = "push" ]; then
            python scripts/fetch_live.py || python scripts/update.py
          else
            python scripts/update.py
          fi
      - name: Commit cache taxa e pulizia file non più versionati
        run: |
          git config user.name "funghi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached --ignore-unmatch --quiet data/latest.json data/layers
          [ -f data/taxa.json ] && git add data/taxa.json
          git diff --staged --quiet && exit 0
          git commit -m "Aggiornamento $(date -u +%F)"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
